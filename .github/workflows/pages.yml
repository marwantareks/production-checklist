name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

# The build job only needs to read the repository. Pages write access is granted to the deploy job alone.
permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Validate, build and test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run validate
      - run: npm run build
      - run: npm test
      - name: Stage the site and record its SHA-256
        run: |
          mkdir site
          cp dist/index.html site/index.html
          touch site/.nojekyll
          (cd site && sha256sum index.html | tee index.html.sha256)
          echo "SHA-256 of index.html: \`$(cut -d' ' -f1 site/index.html.sha256)\`" >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: site

  deploy:
    name: Deploy
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4.0.5
