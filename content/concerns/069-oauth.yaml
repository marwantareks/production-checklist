id: 69
name: OAuth
category: security
order: 30
ownership: own
definition: Protocol for delegated authorization.
how_it_works: OAuth 2.0 lets an application get limited access to a resource on a user’s behalf
  without handling their password. OpenID Connect adds identity on top. Safe use means the right
  flow for each client (authorization code with PKCE for browsers and mobile), exact redirect URI
  checks, narrow scopes and careful token storage.
where_it_appears: Authentication and authorization configuration, login and callback handlers, token
  validation code and identity provider settings.
review_question: Does each client use the flow that current OAuth security guidance recommends for
  its type, with exact redirect matching and minimal scopes?
trade_off: Standardized delegation versus subtle misconfiguration risks and token handling.
why_it_matters: OAuth is easy to misconfigure, and mistakes such as loose redirect URIs or the wrong
  flow lead to account takeover.
red_flags:
  - Implicit flow or password grant used
  - Redirect URIs with wildcards
  - Browser apps storing tokens in localStorage or sessionStorage where a backend-for-frontend is
    feasible
  - Missing or unchecked state and nonce values
  - ID tokens sent to APIs as access tokens
good_looks_like:
  - Authorization code flow with PKCE for all clients
  - Exact redirect URI matching
  - Narrow scopes and short token lifetimes
  - Refresh tokens for public clients rotated on use with reuse detection, or bound to the client
also_fits: Traffic and APIs
related:
  - 70
  - 5
  - 77
  - 79
agent_check:
  level: partial
  search_hints:
    - oauth
    - oidc
    - redirect_uri
    - pkce
    - code_challenge
    - code_verifier
    - response_type=token
    - grant_type=password
    - id_token
    - access_token
    - refresh_token
    - nonce
    - localStorage.setItem
    - jwks
