# yaml-language-server: $schema=../../schema/concern.schema.json
id: 67
name: Secrets management
category: security
order: 10
ownership: own
definition: Securely storing and rotating credentials (Vault, Secrets Manager).
how_it_works: Credentials, keys and tokens are kept out of source code and configuration files and
  held in a dedicated secret store. Applications fetch them at runtime using a narrowly scoped
  identity, access is logged, and secrets are rotated on a schedule and after any suspected
  exposure.
where_it_appears: Source code and its history, environment files, container images, CI/CD pipeline
  variables, infrastructure code, and application configuration.
review_question: Where do secrets live, who can read them, and how are they rotated?
trade_off: Central vaults improve control but add a critical dependency and rotation complexity.
why_it_matters: A secret committed to a repository is copied everywhere the repository goes and is
  hard to remove completely. Leaked credentials are a common cause of breaches.
red_flags:
  - Keys, passwords or tokens in source, config or example files
  - Committed .env files, or secrets passed as container build arguments
  - One shared credential used by every environment
  - No rotation process
  - Kubernetes Secret manifests committed with real values, since base64 is encoding and not
    encryption
  - Secrets printed in logs or error messages
good_looks_like:
  - No secrets in the repository or its history
  - Secrets pulled at runtime from a vault or cloud secret manager
  - Separate credentials per environment with minimal permissions
  - Secret scanning in CI and a rotation procedure
  - A leaked secret is revoked and replaced first, because rewriting history does not remove copies
  - Workload identity or OIDC federation used instead of stored long-lived keys where the platform
    supports it
decide_between: Secrets injected as environment variables, mounted as files, or fetched from the
  secret store at runtime. Environment variables are simple but can leak through crash dumps, debug
  endpoints, child processes and container inspection, and change only on restart. Mounted files can
  refresh without a restart. Runtime fetching supports rotation best but adds a startup dependency.
also_fits: Infrastructure
related:
  - 68
  - 70
  - 6
  - 59
agent_check:
  level: code
  search_hints:
    - api_key
    - password =
    - secret =
    - token =
    - PRIVATE KEY-----
    - AKIA
    - ghp_
    - sk_live_
    - "kind: Secret"
    - --build-arg
    - .env
    - .gitleaks.toml
    - vault
    - secretsmanager
    - KeyVault
