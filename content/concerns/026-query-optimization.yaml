# yaml-language-server: $schema=../../schema/concern.schema.json
id: 26
name: Query optimization
category: databases
order: 20
ownership: guardrail
definition: Tuning queries and execution plans to cut time and resource use.
how_it_works: Query optimization finds and fixes slow queries by reading execution plans, adding or
  changing indexes, selecting fewer columns and rows, avoiding unnecessary joins and moving work out
  of hot paths. It is driven by measuring real queries, not by guessing. EXPLAIN ANALYZE runs the
  query, so wrap data-changing statements in a transaction that is rolled back, and avoid running
  heavy queries this way on the primary.
where_it_appears: Data access code, repositories and ORM queries, reporting queries, slow query logs
  and plan output from the database.
review_question: Are slow queries tracked and reviewed with execution plans?
trade_off: Tuning gains must be weighed against schema complexity and the time spent.
why_it_matters: One heavy query can slow the whole database and every service that uses it, and the
  cost rises with data size.
red_flags:
  - SELECT * in application queries instead of naming the columns needed
  - Queries that load whole tables and filter in application code
  - No pagination on list endpoints
  - No slow query logging or review
  - Filters that wrap indexed columns in functions or casts, or use a leading wildcard LIKE, so the
    index cannot be used
good_looks_like:
  - Slow query logging turned on, reviewed and tied to fixes
  - Queries select only what is needed, and large lists use keyset pagination rather than deep OFFSET
  - Execution plans checked for important queries
  - Statement timeouts set so a runaway query is cancelled
  - Heavy reporting kept off the primary transactional database
also_fits: Performance
related:
  - 25
  - 27
  - 61
agent_check:
  level: partial
  search_hints:
    - SELECT *
    - explain analyze
    - log_min_duration_statement
    - slow_query_log
    - long_query_time
    - auto_explain
    - statement_timeout
    - pg_stat_statements
    - findAll(
    - findMany(
    - .ToList()
