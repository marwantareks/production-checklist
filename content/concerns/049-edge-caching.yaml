# yaml-language-server: $schema=../../schema/concern.schema.json
id: 49
name: Edge caching
category: caching
order: 30
ownership: own
definition: Rules for which responses are cached at the edge, for how long and under which key.
how_it_works: Edge caching stores responses at locations near users, often at the CDN or in an edge
  runtime. It can cache static files, API responses and rendered pages for a short time. The cache
  key, which includes parts such as path, query string and some headers, decides what is shared
  between users. Any request header or parameter that changes the response must be in the key, or an
  attacker can poison the cache.
where_it_appears: CDN cache rules and cache key settings, edge function code, and response headers
  such as Cache-Control, CDN-Cache-Control, Surrogate-Control, Vary and Surrogate-Key.
review_question: What can safely be cached at the edge, and for which users?
trade_off: Speed close to the user versus the risk of serving stale or wrongly shared personalized data.
why_it_matters: A mistake in the cache key can leak one user’s response to another, and a mistake in
  lifetime can show old content for a long time.
red_flags:
  - Personalized or authenticated responses cacheable at the shared edge instead of being marked
    private or no-store
  - Request headers or parameters that change the response but are not in the cache key, allowing
    cache poisoning
  - Query strings that vary on every request, so nothing is ever a cache hit
  - Very long lifetimes with no purge mechanism
  - Error responses cached for long periods, or temporary server errors cached as if final
good_looks_like:
  - Only responses known to be shared are cached at the edge
  - Personal parts are split from shared content rather than keyed by cookie or token
  - The cache key includes everything that changes the response, and nothing that doesn’t
  - Short lifetimes or tag-based purge for content that changes, and stale-if-error to serve the
    last good copy
  - Hit ratio and purge activity are monitored
applies_when: Applies when the system caches pages or API responses, not just static files, at a CDN
  or edge runtime.
related:
  - 48
  - 50
agent_check:
  level: partial
  search_hints:
    - s-maxage
    - stale-while-revalidate
    - stale-if-error
    - CDN-Cache-Control
    - Surrogate-Control
    - Surrogate-Key
