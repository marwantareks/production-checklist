# yaml-language-server: $schema=../../schema/concern.schema.json
id: 84
name: Backups
category: resilience
order: 80
ownership: own
definition: Data copies; only useful if restores are tested.
how_it_works: Backups are copies of data stored separately so it can be restored after loss or
  corruption. A good setup defines what is backed up, how often (or, with point-in-time recovery,
  how often logs are shipped), the longest acceptable restore time, where copies are kept, for how
  long, and who can delete them. Measure restore time in every test. Backups of related stores taken
  at different moments may not restore consistently, and backups work only while their keys exist,
  so keep a key in the backup account and protect it from deletion. A backup counts only if a
  restore has been tested.
where_it_appears: Backup settings for databases, object storage, secrets, configuration and
  infrastructure state in infrastructure code, snapshot schedules, backup job scripts, retention
  policies and restore runbooks.
review_question: What evidence shows that restores from this data store succeed within the recovery
  time and recovery point targets?
trade_off: More frequent and longer-retained backups cost storage and may conflict with retention rules.
why_it_matters: Backups are the last defense against deletion, corruption and ransomware, but only
  if they are isolated and cannot be deleted with production credentials. Untested ones often turn
  out to be incomplete or unusable.
red_flags:
  - No backup configured for a data store
  - No backup copy outside the source account and region, or every copy deletable with production
    credentials
  - No restore ever tested
  - Retention not matched to legal or business need
  - Infrastructure code that deletes backups with the resource, skips a final snapshot or has
    deletion protection off for data stores
good_looks_like:
  - Every data store has an automated backup with defined frequency and retention
  - Copies kept in a separate account or region and protected from deletion
  - Backups immutable for their retention period and surviving deletion of the source resource, with
    retention reviewed before compliance-mode locks are applied
  - Restores tested on a schedule with recorded results
  - Encryption and access controls applied to backups
  - Integrity checks or reconciliation to catch silent corruption before it reaches every backup
also_fits: Databases
related:
  - 83
  - 67
  - 72
  - 115
agent_check:
  level: partial
  search_hints:
    - backup_retention_period
    - delete_automated_backups
    - skip_final_snapshot
    - deletion_protection
    - prevent_destroy
    - point_in_time_recovery_enabled
    - backup_configuration
    - geo_redundant_backup_enabled
    - aws_backup_plan
    - aws_backup_vault_lock_configuration
    - object_lock
    - DeletionPolicy
    - pgbackrest
    - wal-g
    - velero
