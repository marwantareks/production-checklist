id: 123
name: Third-party dependency resilience
category: resilience
order: 160
ownership: own
definition: Planning for the outages, limits and changes of the external services your system depends on.
how_it_works: "Most systems depend on services they do not run: payment, identity, email and SMS
  providers, maps, data feeds and cloud platforms. A hard dependency with no fallback caps your
  availability at its own, and several in series give roughly the product of their availability if
  they fail independently. Published SLA figures are promises, not measurements, and credits rarely
  cover an outage. Resilience means knowing what you depend on and what happens when each fails,
  with timeouts, fallbacks, a contact path, and attention to quotas, provider changes and backups
  that share hosting with their primary."
where_it_appears: Dependency inventories, architecture diagrams, vendor contracts and service level
  agreements, integration code and client settings, provider status feeds, and incident records
  involving vendors.
review_question: What continuity and fallback plans exist for each critical external dependency?
trade_off: Relying on providers speeds delivery but hands part of your reliability, cost and roadmap
  to someone else.
why_it_matters: A single provider outage can stop revenue, and teams often find they have no
  fallback, no contact and no contract remedy only after it happens.
red_flags:
  - No list of external services with an owner and an impact if each fails
  - Availability targets higher than the combined availability of providers on the critical path
    that have no fallback
  - Calls to providers with no timeout, retry limit or fallback
  - No contact path or support tier for critical vendors
  - Provider limits, quotas, deprecations or credential expiry unknown or unmonitored
  - No exit or substitute plan for a single-source provider, or a backup that shares the primary’s
    hosting
good_looks_like:
  - An inventory of external dependencies with criticality, owner and provider commitments
  - Composite availability worked out for critical paths and compared with targets
  - Timeouts, circuit breakers and fallbacks for every critical provider call
  - Retries use idempotency keys where supported, respect Retry-After and stay within quota
  - Provider status and quota use monitored
  - Failure of each critical provider tested or rehearsed
related:
  - 10
  - 12
  - 14
  - 121
agent_check:
  level: partial
  search_hints:
    - Idempotency-Key
    - Retry-After
    - setConnectTimeout
    - "@Retry"
    - resilience4j
    - opossum
    - axios-retry
  evidence_to_request:
    - The inventory of external services and their service level terms
    - The availability calculation for critical paths
    - The latest test or rehearsal of a provider failure
